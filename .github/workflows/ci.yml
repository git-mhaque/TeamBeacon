name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-runtime-compatibility:
    name: API import (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check API startup imports
        run: python -c "import services.api.server"

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend coverage tooling
        run: python -m pip install coverage==7.16.2

      - name: Run unit tests with API coverage
        run: python -m coverage run --branch --source=services.api.server,services.api.integrations.jira_sync,services.api.metadata.epic_mapping -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Run API integration tests
        run: python -m coverage run --append --branch --source=services.api.server,services.api.integrations.jira_sync,services.api.metadata.epic_mapping -m unittest discover -s tests/integration/api -p "test_*.py" -v

      - name: Enforce coverage for each modified API module
        run: |
          python -m coverage report --include=services/api/server.py --precision=2 --fail-under=90
          python -m coverage report --include=services/api/integrations/jira_sync.py --precision=2 --fail-under=90
          python -m coverage report --include=services/api/metadata/epic_mapping.py --precision=2 --fail-under=90

  frontend-tests:
    name: Frontend (React + Vite) Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build React frontend
        working-directory: app
        run: npm run build

      - name: Lint frontend
        working-directory: app
        run: npm run lint

      - name: Run frontend unit tests with coverage
        working-directory: app
        run: npm run test:coverage

      - name: Build MCP dashboard widget
        working-directory: app
        run: npm run build:mcp

      - name: Setup Python for MCP checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install optional MCP dependencies
        run: python -m pip install -r services/mcp/requirements-dev.lock

      - name: Lint MCP adapter
        run: python -m ruff check --config services/mcp/ruff.toml services/mcp tests/mcp

      - name: Test MCP protocol and coverage
        run: |
          python -m coverage run --branch --source=services.mcp -m unittest discover -s tests/mcp -v
          python -m coverage report --fail-under=90

  docker-image:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-tests
      - frontend-tests
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/git-mhaque/teambeacon
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
