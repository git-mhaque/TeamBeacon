name: Release macOS Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build macOS binaries and upload artifacts only (no GitHub Release)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-release:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build macOS binaries (manual test mode)
        if: github.event_name == 'workflow_dispatch' && inputs.build_only
        working-directory: app
        run: |
          rustup target add "${{ matrix.target }}"
          cargo install tauri-cli --locked
          npm run build:release
          cargo tauri build --target "${{ matrix.target }}"

      - name: Upload test artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.build_only
        uses: actions/upload-artifact@v4
        with:
          name: teambeacon-macos-${{ matrix.target }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            app/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
          if-no-files-found: error

      - name: Build and upload draft GitHub release assets
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: TeamBeacon ${{ github.ref_name }}
          releaseBody: Automated macOS release for TeamBeacon.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
